name: Dev Ops v3 enforcement

on:
  pull_request:
    branches:
      - development
      - production

permissions:
  contents: read
  issues: read
  id-token: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout caller candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate relay configuration
        shell: bash
        env:
          RELAY_URL: ${{ vars.DEVOPS_PUBLIC_ENFORCEMENT_URL }}
          EXPECTED_REVISION: ${{ vars.DEVOPS_PUBLIC_ENFORCEMENT_REVISION }}
        run: |
          if [[ ! "$RELAY_URL" =~ ^https:// ]]; then
            echo 'DEVOPS_PUBLIC_ENFORCEMENT_URL must be a configured HTTPS repository variable' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'DEVOPS_PUBLIC_ENFORCEMENT_REVISION must be a configured exact 40-character control-plane SHA' >&2
            exit 1
          fi

      - name: Resolve trusted pull-request and work-order context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'Dev Ops v3 enforcement requires a pull_request event context' >&2
            exit 1
          fi
          ref="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^- Issue\/work order: (#[0-9]+).*$/\1/p' | head -n 1)"
          if [[ ! "$ref" =~ ^#[0-9]+$ ]]; then
            echo 'PR body must contain one canonical - Issue/work order: #123 reference' >&2
            exit 1
          fi
          number="${ref#\#}"
          record="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}")"
          if jq -e 'has("pull_request")' <<< "$record" >/dev/null; then
            echo "Work-order reference $ref resolves to a pull request, not an Issue" >&2
            exit 1
          fi
          state="$(jq -r '.state // ""' <<< "$record")"
          if [[ "$state" != 'open' ]]; then
            echo "Work-order Issue $ref must be open; observed state=$state" >&2
            exit 1
          fi
          body="$(jq -r '.body // ""' <<< "$record")"
          if [[ -z "$body" ]]; then
            echo "Work-order Issue $ref has no readable body" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          delimiter="DEVOPS_WORK_ORDER_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$body" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Request exact central enforcement bundle
        id: bootstrap
        shell: bash
        env:
          RELAY_URL: ${{ vars.DEVOPS_PUBLIC_ENFORCEMENT_URL }}
          EXPECTED_REVISION: ${{ vars.DEVOPS_PUBLIC_ENFORCEMENT_REVISION }}
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=blackline-devops-v3-public-enforcement")"
          oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          payload="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg expectedRevision "$EXPECTED_REVISION" \
            '{repository:$repository,expectedRevision:$expectedRevision}')"
          endpoint="${RELAY_URL%/}/v3/enforcement/bootstrap"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $oidc_token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output "$RUNNER_TEMP/devops-v3-bootstrap.json" \
            "$endpoint"
          jq -e \
            --arg revision "$EXPECTED_REVISION" \
            '.ok == true and .bundle.schemaVersion == 1 and .bundle.controlPlaneRevision == $revision and (.bundle.files | type == "array")' \
            "$RUNNER_TEMP/devops-v3-bootstrap.json" >/dev/null
          echo "control-plane-revision=$EXPECTED_REVISION" >> "$GITHUB_OUTPUT"
          echo "bundle-sha256=$(jq -r '.bundle.bundleSha256' "$RUNNER_TEMP/devops-v3-bootstrap.json")" >> "$GITHUB_OUTPUT"

      - name: Verify and reconstruct ephemeral central bundle
        shell: bash
        env:
          EXPECTED_REVISION: ${{ vars.DEVOPS_PUBLIC_ENFORCEMENT_REVISION }}
          BOOTSTRAP_PATH: ${{ runner.temp }}/devops-v3-bootstrap.json
          BUNDLE_ROOT: ${{ runner.temp }}/devops-v3-bundle
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const sha256 = value => createHash('sha256').update(value).digest('hex');
          const response = JSON.parse(await readFile(process.env.BOOTSTRAP_PATH, 'utf8'));
          const bundle = response?.bundle;
          if (!response?.ok || !bundle || bundle.controlPlaneRevision !== process.env.EXPECTED_REVISION) {
            throw new Error('relay bundle revision/shape mismatch');
          }
          const root = path.resolve(process.env.BUNDLE_ROOT);
          const seen = new Set();
          const identities = [];
          for (const file of bundle.files ?? []) {
            if (typeof file?.path !== 'string' || typeof file?.sha256 !== 'string' || typeof file?.contentBase64 !== 'string') {
              throw new Error('relay bundle contains an invalid file record');
            }
            const normalized = file.path.replaceAll('\\\\', '/');
            if (!normalized || normalized.startsWith('/') || normalized.split('/').some(part => !part || part === '.' || part === '..')) {
              throw new Error(`unsafe relay bundle path: ${file.path}`);
            }
            if (seen.has(normalized)) throw new Error(`duplicate relay bundle path: ${normalized}`);
            seen.add(normalized);
            const bytes = Buffer.from(file.contentBase64, 'base64');
            if (sha256(bytes) !== file.sha256) throw new Error(`relay bundle file hash mismatch: ${normalized}`);
            const target = path.resolve(root, normalized);
            if (!target.startsWith(root + path.sep)) throw new Error(`relay bundle path escaped root: ${normalized}`);
            await mkdir(path.dirname(target), { recursive: true });
            await writeFile(target, bytes);
            identities.push(`${normalized}:${file.sha256}`);
          }
          identities.sort();
          const expectedBundleSha = sha256(`${bundle.controlPlaneRevision}\n${identities.join('\n')}`);
          if (expectedBundleSha !== bundle.bundleSha256) throw new Error('relay bundle aggregate hash mismatch');
          NODE

      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Run central v3 enforcement
        id: central
        shell: bash
        env:
          DEVOPS_CALLER_ROOT: ${{ github.workspace }}
          DEVOPS_CALLER_REPOSITORY: ${{ github.repository }}
          DEVOPS_MANIFEST_PATH: .blackline-devops.json
          DEVOPS_STANDARDS_EVIDENCE_PATH: .blackline/standards-evidence.json
          DEVOPS_WORK_ORDER_REF: ${{ steps.context.outputs.ref }}
          DEVOPS_WORK_ORDER_BODY: ${{ steps.context.outputs.body }}
          DEVOPS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEVOPS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEVOPS_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEVOPS_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          DEVOPS_PR_TITLE: ${{ github.event.pull_request.title }}
          DEVOPS_PR_BODY: ${{ github.event.pull_request.body }}
          DEVOPS_PRODUCTION_AUTHORIZATION: Pending
          DEVOPS_EVIDENCE_PATH: ${{ runner.temp }}/v3-enforcement-evidence.json
        run: node "$RUNNER_TEMP/devops-v3-bundle/scripts/vnext-enforce-managed-repository.mjs" --run

      - name: Summarize enforcement provenance
        shell: bash
        env:
          CONTROL_PLANE_REVISION: ${{ steps.bootstrap.outputs.control-plane-revision }}
          BUNDLE_SHA: ${{ steps.bootstrap.outputs.bundle-sha256 }}
          ENFORCEMENT_REVISION: ${{ steps.central.outputs.enforcement-revision }}
          COMPATIBILITY_STATE: ${{ steps.central.outputs.compatibility-state }}
          EFFECTIVE_CONTRACT: ${{ steps.central.outputs.effective-contract-id }}
          CONFORMANCE_SHA: ${{ steps.central.outputs.standards-conformance-sha256 }}
          ACCEPTANCE_SHA: ${{ steps.central.outputs.standards-acceptance-sha256 }}
          EVIDENCE_SHA: ${{ steps.central.outputs.evidence-sha256 }}
        run: |
          {
            echo '### Dev Ops v3 central enforcement'
            echo "- Control-plane revision: $CONTROL_PLANE_REVISION"
            echo "- Relay bundle: $BUNDLE_SHA"
            echo "- Enforcement revision: $ENFORCEMENT_REVISION"
            echo "- Compatibility: $COMPATIBILITY_STATE"
            echo "- Effective contract: $EFFECTIVE_CONTRACT"
            echo "- Standards conformance: $CONFORMANCE_SHA"
            echo "- Standards acceptance: $ACCEPTANCE_SHA"
            echo "- Evidence: $EVIDENCE_SHA"
            echo '- Production authority: not granted by this check'
          } >> "$GITHUB_STEP_SUMMARY"
