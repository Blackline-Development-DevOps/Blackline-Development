name: Review brand site candidate

on:
  push:
    branches:
      - chore/publish-brand-assets
    paths:
      - .github/workflows/review-brand-site.yml

permissions:
  contents: read

jobs:
  package-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package static site for visual review
        uses: actions/upload-artifact@v4
        with:
          name: blackline-development-brand-site-review
          path: dist/
          if-no-files-found: error
          retention-days: 1
