name: Bootstrap dependency lockfile

on:
  push:
    branches:
      - feature/public-site-foundation

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/public-site-foundation

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate lockfile when missing
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "package-lock.json already exists; no bootstrap change required."
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add dependency lockfile"
          git push origin HEAD:feature/public-site-foundation
